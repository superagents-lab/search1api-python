[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "search1api"
version = "0.2.1"
description = "Official Python client for Search1API"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
authors = [{ name = "Search1API" }]
dependencies = ["httpx>=0.27,<1"]
keywords = ["search", "crawl", "api", "ai", "sdk"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "mypy>=1.14,<2",
  "pytest>=8,<9",
  "ruff>=0.9,<1",
]

[project.urls]
Homepage = "https://s1.dev"
Documentation = "https://s1.dev/docs/integrations/sdks"
Repository = "https://github.com/superagents-lab/search1api-python"
Issues = "https://github.com/superagents-lab/search1api-python/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/search1api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.9"
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_return_any = true
warn_unused_ignores = true

[tool.ruff]
target-version = "py39"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
